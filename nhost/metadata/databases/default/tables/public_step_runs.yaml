table:
  name: step_runs
  schema: public
object_relationships:
  - name: run
    using:
      foreign_key_constraint_on: run_id
  - name: step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        run:
          workflow:
            organization:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
