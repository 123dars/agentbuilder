table:
  name: organizations
  schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        members:
          user_id:
            _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      check: {}
      set: {}
      columns:
        - name
        - quota_limit
        - quota_used
