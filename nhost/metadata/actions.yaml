actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: "https://agentbuilder-d9zi-puce.vercel.app/api/actions/approveStep"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
  - name: retryStep
    definition:
      kind: synchronous
      handler: "https://agentbuilder-d9zi-puce.vercel.app/api/actions/retryStep"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "https://agentbuilder-d9zi-puce.vercel.app/api/actions/triggerWorkflowRun"
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerRunResponse
    - name: ApproveStepResponse
    - name: RetryStepResponse
  scalars: []
